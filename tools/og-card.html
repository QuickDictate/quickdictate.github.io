<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!--
  Source for the social share card at ../assets/og-image.png.
  Render at 1200x630 with headless Chrome, run from the repo root:
    chrome --headless --screenshot=assets/og-image.png \
      --window-size=1200,630 --hide-scrollbars tools/og-card.html
-->
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1200px;height:630px;overflow:hidden;}
  body{
    font-family:-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    background:
      radial-gradient(ellipse 720px 480px at 84% 6%, rgba(46,125,246,.30), transparent 60%),
      radial-gradient(ellipse 640px 440px at 4% 2%, rgba(192,80,77,.20), transparent 58%),
      #0F1B30;
    color:#F7F9FC;
    position:relative;
  }
  /* faint starfield */
  .stars{position:absolute;inset:0;
    background-image:
      radial-gradient(1.5px 1.5px at 20% 30%, rgba(255,255,255,.35), transparent),
      radial-gradient(1.5px 1.5px at 70% 20%, rgba(255,255,255,.28), transparent),
      radial-gradient(1.5px 1.5px at 88% 62%, rgba(255,255,255,.25), transparent),
      radial-gradient(1.5px 1.5px at 35% 78%, rgba(255,255,255,.22), transparent),
      radial-gradient(1.5px 1.5px at 55% 46%, rgba(255,255,255,.18), transparent);
  }
  .frame{position:absolute;inset:0;padding:72px 80px;display:flex;flex-direction:column;justify-content:space-between;}
  .top{display:flex;justify-content:space-between;align-items:center;gap:48px;}
  .eyebrow{font-family:ui-monospace,"Cascadia Code",Consolas,monospace;font-size:21px;letter-spacing:.22em;text-transform:uppercase;color:#D46662;display:flex;align-items:center;gap:14px;}
  .eyebrow::before{content:"";width:11px;height:11px;background:#D46662;border-radius:2px;box-shadow:0 0 14px rgba(212,102,98,.9);}
  h1{font-size:74px;line-height:1.04;font-weight:800;letter-spacing:-.02em;margin-top:26px;}
  h1 .accent{color:#2E7DF6;}
  .sub{font-size:28px;color:#9FB0C9;margin-top:28px;max-width:640px;line-height:1.42;}
  .icon-wrap{flex:none;filter:drop-shadow(0 26px 64px rgba(46,125,246,.60));}
  .icon-wrap img{width:184px;height:184px;border-radius:40px;display:block;}
  .bottom{display:flex;justify-content:space-between;align-items:center;gap:30px;}
  .badges{display:flex;gap:14px;}
  .badge{font-family:ui-monospace,Consolas,monospace;font-size:20px;color:#C6D2E4;background:rgba(255,255,255,.05);border:1px solid #2A3D5C;border-radius:11px;padding:11px 19px;white-space:nowrap;}
  .domain{font-family:ui-monospace,Consolas,monospace;font-size:27px;color:#F7F9FC;font-weight:600;white-space:nowrap;}
  .domain b{color:#D46662;font-weight:600;}
</style>
</head>
<body>
  <div class="stars"></div>
  <div class="frame">
    <div class="top">
      <div>
        <div class="eyebrow">Windows · Speech-to-text</div>
        <h1>Talk instead of type —<br><span class="accent">in any app you’re in.</span></h1>
        <div class="sub">Dictation that lives in your tray. Bring your own key. No subscription, no telemetry.</div>
      </div>
      <div class="icon-wrap"><img src="../assets/icon-256.png" alt=""></div>
    </div>
    <div class="bottom">
      <div class="badges">
        <span class="badge">Free &amp; MIT</span>
        <span class="badge">6 STT providers</span>
        <span class="badge">Types into any app</span>
      </div>
      <div class="domain">quickdictate<b>.github.io</b></div>
    </div>
  </div>
</body>
</html>
