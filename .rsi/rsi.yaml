schema: hydra-rsi/1
# Bytes a visitor can download from the QuickDictate landing site (committed HTML, images, txt, xml at HEAD).
# Smaller means a faster first load for the page that sells the product.
metrics:
  - id: site.shipped_bytes
    kind: size
    better: lower
    unit: bytes
    measure: "python scripts/rsi/shipped_bytes.py"
    pick: 'shipped_bytes=(\d+)'
    gate: exact
    light: true
